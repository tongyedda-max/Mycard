<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>想法孵化器</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- vis.js for network graph -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f7f7;
            --drawer-bg: #ffffff;
            --text-color: #333;
            --border-color: #ddd;
            --accent-color: #4f46e5;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column;
        }
        
        /* 密碼鎖畫面 */
        #password-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }
        #password-screen h2 { margin-bottom: 5px; }
        #password-screen p { margin-top: 0; color: #666; font-size: 14px; }
        #password-screen input {
            padding: 12px; font-size: 16px; width: 80%; max-width: 300px; margin-bottom: 10px;
            border: 1px solid var(--border-color); border-radius: 8px;
        }
        #password-screen button {
            padding: 12px 24px; font-size: 16px; background: var(--accent-color); color: white;
            border: none; border-radius: 8px; cursor: pointer;
        }
        
        /* 抽屜通用樣式 */
        .drawer {
            background: var(--drawer-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            overflow: hidden;
            transition: max-height 0.3s ease;
            flex-shrink: 0;
        }
        .drawer.collapsed {
            max-height: 42px !important; /* 強制收起高度 */
        }
        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; cursor: pointer; background: #f0f0f0;
            font-weight: bold; font-size: 14px; user-select: none;
            border-bottom: 1px solid #ddd;
        }
        .drawer-content {
            padding: 15px; overflow-y: auto; flex-grow: 1;
            scrollbar-width: thin;
        }
        /* 允許拖曳縮放 */
        .resizable {
            resize: vertical; 
            overflow: auto;
            min-height: 100px; /* 展開時最小高度 */
        }
        
        /* 元件樣式 */
        textarea, input[type="text"] {
            width: 100%; padding: 10px;
            border: 1px solid #ccc; border-radius: 6px; font-size: 16px; font-family: inherit;
        }
        textarea { min-height: 150px; resize: vertical; }
        button {
            background: var(--accent-color); color: white; border: none;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px;
            white-space: nowrap;
        }
        button.secondary { background: #ccc; color: #333; }
        .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .tag-input { flex-grow: 1; }
        
        .question-box {
            font-style: italic; color: #555; background: #fff8e1;
            padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #ffb300;
            line-height: 1.5;
        }
        .note-item {
            padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .note-item:hover { background: #f9f9f9; }
        
        #network-container { height: 100%; width: 100%; background: #fafafa; }
        
        /* 輸入區塊預設佔滿剩餘空間 */
        #drawer-input { flex-grow: 1; min-height: 200px; }
        #drawer-input .drawer-content { display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <!-- 密碼解鎖畫面 -->
    <div id="password-screen">
        <h2>🔒 歡迎來到想法孵化器</h2>
        <p>請輸入密碼以繼續</p>
        <input type="password" id="pwd-input" placeholder="密碼" onkeyup="if(event.key==='Enter') checkPassword()">
        <button onclick="checkPassword()">進入</button>
    </div>

    <!-- 主體容器 -->
    <div id="app-container" style="display: none; flex-direction: column; height: 100vh; overflow: hidden;">

        <!-- 抽屜 1：蘇格拉底提問區 -->
        <div class="drawer" id="drawer-question" style="max-height: 250px;">
            <div class="drawer-header" onclick="toggleDrawer('drawer-question')">
                <span>💡 蘇格拉底提問</span>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="drawer-content resizable">
                <div class="question-box" id="question-display">輸入標籤後，在這裡生成提問...</div>
                <button class="secondary" onclick="generateQuestion()">🔄 換一個問題</button>
            </div>
        </div>

        <!-- 抽屜 2：舊筆記聯想區 -->
        <div class="drawer" id="drawer-notes" style="max-height: 200px;">
            <div class="drawer-header" onclick="toggleDrawer('drawer-notes')">
                <span>📎 舊筆記聯想</span>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="drawer-content resizable" id="notes-display" style="min-height: 50px;">
                <div style="color:#999;">開始打字，停頓3秒後會自動搜尋舊筆記...</div>
            </div>
        </div>

        <!-- 抽屜 3：輸入區 (預設佔滿) -->
        <div class="drawer" id="drawer-input">
            <div class="drawer-header" onclick="toggleDrawer('drawer-input')">
                <span>✍️ 寫下想法</span>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="drawer-content" style="flex-grow: 1; display: flex; flex-direction: column;">
                <textarea id="content-input" placeholder="寫下你的跨領域聯想..." oninput="onContentTyping()" style="flex-grow: 1;"></textarea>
                <div class="row">
                    <input type="text" id="tag-input" class="tag-input" placeholder="輸入標籤(逗號分隔), 如: 引力,和聲" oninput="generateQuestion()">
                    <button onclick="saveIdea()">存檔</button>
                </div>
            </div>
        </div>

        <!-- 抽屜 4：視覺化星圖 -->
        <div class="drawer collapsed" id="drawer-graph" style="max-height: 400px;">
            <div class="drawer-header" onclick="toggleDrawer('drawer-graph')">
                <span>🌌 視覺化星圖</span>
                <span class="toggle-icon">▶</span>
            </div>
            <div class="drawer-content" style="padding: 0; height: 100%;">
                <div id="network-container"></div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. 參數設定區 (請填入你的鑰匙)
        // ==========================================
        const SUPABASE_URL = 'https://jrhivoryeqhhxpeghdrv.supabase.co'; // 換成你的 Project URL
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyaGl2b3J5ZXFoaHhwZWdoZHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjE0OTQsImV4cCI6MjEwMzkzNzQ5NH0.-yqHf60nZCzvt91tTe2tgcnSMn1uoabv6UAIENe9ocg'; // 換成你的 anon public key

        // ==========================================
        // 2. 蘇格拉底提問模板庫 (30個)
        // ==========================================
        const templates = [
            "如果 `[A]` 在你的專業裡，對應的具體動作是什麼？",
            "如果要把 `[A]` 從零開始建構，第一步會是什麼？",
            "`[A]` 有沒有一個臨界點，超過它之後性質就變了？",
            "如果 `[A]` 完全消失，你正在描述的東西還成立嗎？",
            "`[A]` 是你主動製造的，還是它自己產生的？",
            "`[A]` 放大到極致和縮小到極致，分別是什麼樣子？",
            "如果用三個形容詞描述 `[A]` 的本質，你會選哪三個？",
            "`[A]` 在什麼情況下會變成它的反面？",
            "`[A]` 的速度和方向，哪一個更重要？",
            "如果把 `[A]` 教給一個 10 歲的孩子，你會用什麼比喻？",
            "如果 `[A]` 對應到 `[B]`，那 `[A]` 是指具體感受，還是抽象結構？",
            "一定是 `[A]` 造成了 `[B]` 嗎？會不會是 `[B]` 迫使了 `[A]`？",
            "`[A]` 有『質量』和『距離』，在 `[B]` 裡，誰是質量？誰是距離？",
            "如果 `[A]` 會造成加速度，這在 `[B]` 裡表現在節奏上還是力度上？",
            "如果 `[A]` 強度無限大，`[B]` 會是完全的不和諧，還是純粹的共鳴？",
            "有沒有哪種極端情況下，`[A]` 反而會失去對 `[B]` 的作用力？",
            "如果要把 `[A]` 與 `[B]` 的關係教給初學者，你會用什麼動作讓他感受到？",
            "如果 `[A]` 聽起來有一種顏色，`[B]` 會是什麼顏色？",
            "如果把 `[A]` 的感覺轉換成觸覺，那是摩擦力變大，還是重量變重？",
            "如果把 `[A]` 抽掉時間維度，`[B]` 還成立嗎？",
            "`[A]` 可以拆成哪兩個更小的元素？哪一個對 `[B]` 更直接？",
            "會不會有第三個隱藏因素同時影響了 `[A]` 和 `[B]`？",
            "如果把 `[B]` 放慢 100 倍，`[A]` 會變成什麼狀態？",
            "如果一秒內完成 `[B]`，`[A]` 還存在嗎？",
            "如果是 `[B]` 主動吸引你的 `[A]`，而不是你主動製造 `[A]`，執行上會是什麼感覺？",
            "`[A]`、`[B]`、`[C]` 三者之間，誰是因，誰是果，誰是旁觀者？",
            "如果拿掉 `[C]`，`[A]` 和 `[B]` 之間的關係會怎麼變？",
            "`[A]` 到 `[B]` 的距離，跟 `[B]` 到 `[C]` 的距離，哪個更近？",
            "`[A]`、`[B]`、`[C]` 如果是一個三角形，哪一個角是鈍角？",
            "如果這三個是同一件事的三個面，那本體是什麼？"
        ];
        let usedTemplateIndices = [];

        // ==========================================
        // 3. Supabase 初始化與全域變數
        // ==========================================
        let supabaseClient;
        let allIdeas = []; 

        // ==========================================
        // 4. 密碼鎖邏輯 (呼叫 Supabase 比對)
        // ==========================================
        async function checkPassword() {
            const input = document.getElementById('pwd-input').value;
            if (!input) return;
            
            // 呼叫 Supabase 的 check_app_password 函數
            const { data, error } = await supabaseClient.rpc('check_app_password', { input_pass: input });
            
            if (error) {
                alert('驗證時發生錯誤，請檢查 SQL 是否正確執行: ' + error.message);
                return;
            }

            if (data === true) {
                // 密碼正確，記錄在瀏覽器裡 (一天後過期: 86400000 毫秒)
                localStorage.setItem('app_login_time', Date.now().toString());
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                fetchIdeasAndDrawGraph();
            } else {
                alert('密碼錯誤！');
            }
        }

        function checkAutoLogin() {
            const loginTime = localStorage.getItem('app_login_time');
            if (loginTime) {
                if (Date.now() - parseInt(loginTime) < 86400000) {
                    document.getElementById('password-screen').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                    return true;
                } else {
                    localStorage.removeItem('app_login_time');
                }
            }
            return false;
        }

        // ==========================================
        // 5. CRUD: 讀取與存檔
        // ==========================================
        async function fetchIdeasAndDrawGraph() {
            const { data, error } = await supabaseClient
                .from('ideas')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('讀取失敗:', error);
                return;
            }
            allIdeas = data || [];
            drawGraph(allIdeas);
        }

        async function saveIdea() {
            const content = document.getElementById('content-input').value.trim();
            const tags = document.getElementById('tag-input').value.trim();
            const currentQuestion = document.getElementById('question-display').innerText;

            if (!content) {
                alert('想法內容不能為空！');
                return;
            }

            const { data, error } = await supabaseClient
                .from('ideas')
                .insert([{ content: content, tags: tags, generated_question: currentQuestion }])
                .select();

            if (error) {
                alert('存檔失敗:' + error.message);
            } else {
                alert('存檔成功！');
                document.getElementById('content-input').value = '';
                document.getElementById('tag-input').value = '';
                document.getElementById('question-display').innerText = '輸入標籤後，在這裡生成提問...';
                usedTemplateIndices = []; // 重置模板紀錄
                if (data && data.length > 0) {
                    allIdeas.unshift(data[0]);
                    drawGraph(allIdeas);
                }
            }
        }

        // ==========================================
        // 6. 提問模板生成邏輯
        // ==========================================
        function generateQuestion() {
            const tagsRaw = document.getElementById('tag-input').value;
            const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);
            
            if (tags.length === 0) {
                document.getElementById('question-display').innerText = '請先輸入標籤...';
                return;
            }

            let availableIndices = [];
            if (tags.length === 1) {
                availableIndices = [...Array(10).keys()]; 
            } else if (tags.length === 2) {
                availableIndices = [...Array(15).keys()].map(i => i + 10); 
            } else {
                availableIndices = [...Array(5).keys()].map(i => i + 25); 
                availableIndices = availableIndices.concat([...Array(15).keys()].map(i => i + 10));
            }

            // 避免重複，如果全部用過了就重置
            let usableIndices = availableIndices.filter(i => !usedTemplateIndices.includes(i));
            if (usableIndices.length === 0) {
                usedTemplateIndices = usedTemplateIndices.filter(i => availableIndices.includes(i));
                usableIndices = availableIndices;
            }
            
            const randomIndex = usableIndices[Math.floor(Math.random() * usableIndices.length)];
            usedTemplateIndices.push(randomIndex);

            let questionText = templates[randomIndex];
            if (tags.length >= 3) {
                questionText = questionText.replace('`[A]`', `<b>${tags[0]}</b>`)
                                           .replace('`[B]`', `<b>${tags[1]}</b>`)
                                           .replace('`[C]`', `<b>${tags[2]}</b>`);
            } else if (tags.length === 2) {
                questionText = questionText.replace('`[A]`', `<b>${tags[0]}</b>`)
                                           .replace('`[B]`', `<b>${tags[1]}</b>`);
            } else {
                questionText = questionText.replace('`[A]`', `<b>${tags[0]}</b>`);
            }

            document.getElementById('question-display').innerHTML = questionText;
        }

        // ==========================================
        // 7. 舊筆記聯想邏輯 (停頓3秒觸發)
        // ==========================================
        let typingTimer;
        function onContentTyping() {
            clearTimeout(typingTimer);
            const notesDisplay = document.getElementById('notes-display');
            notesDisplay.innerHTML = '<div style="color:#999;">搜尋中...</div>';
            
            typingTimer = setTimeout(() => {
                const currentText = document.getElementById('content-input').value;
                if (currentText.trim().length < 2) {
                    notesDisplay.innerHTML = '<div style="color:#999;">開始打字，停頓3秒後會自動搜尋舊筆記...</div>';
                    return;
                }
                searchOldNotes(currentText);
            }, 3000); 
        }

        function searchOldNotes(text) {
            const keywords = text.split(/[\s,，。、]+/).filter(k => k.length > 1);
            if (keywords.length === 0 && !text.trim()) return;

            const matchedNotes = [];
            allIdeas.forEach(idea => {
                let isMatch = false;
                keywords.forEach(kw => {
                    if ((idea.content && idea.content.includes(kw)) || (idea.tags && idea.tags.includes(kw))) {
                        isMatch = true;
                    }
                });
                if (isMatch && !matchedNotes.find(n => n.id === idea.id)) {
                    matchedNotes.push(idea);
                }
            });

            const notesDisplay = document.getElementById('notes-display');
            if (matchedNotes.length === 0) {
                notesDisplay.innerHTML = '<div style="color:#999;">沒有找到相關的舊筆記。</div>';
            } else {
                let html = '<button class="secondary" onclick="searchOldNotes(document.getElementById(\'content-input\').value)" style="margin-bottom:10px;">🔄 重新搜尋</button>';
                matchedNotes.slice(0, 10).forEach(note => {
                    const preview = note.content.substring(0, 50) + '...';
                    const safeContent = note.content.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    html += `<div class="note-item" onclick="alert('${safeContent}')">${preview}</div>`;
                });
                notesDisplay.innerHTML = html;
            }
        }

        // ==========================================
        // 8. 抽屜開闔邏輯
        // ==========================================
        function toggleDrawer(id) {
            const drawer = document.getElementById(id);
            drawer.classList.toggle('collapsed');
            
            if (id === 'drawer-graph' && !drawer.classList.contains('collapsed')) {
                setTimeout(() => {
                    drawGraph(allIdeas);
                }, 100);
            }
            
            const icon = drawer.querySelector('.toggle-icon');
            if (drawer.classList.contains('collapsed')) {
                icon.innerText = '▶';
            } else {
                icon.innerText = '▼';
            }
        }

        // ==========================================
        // 9. Vis.js 視覺化星圖邏輯
        // ==========================================
        let network = null;
        function drawGraph(ideas) {
            const container = document.getElementById('network-container');
            if (!container) return;

            let nodes = [];
            let edges = [];
            let tagNodes = new Map(); 
            
            ideas.forEach(idea => {
                nodes.push({ id: idea.id, label: idea.content.substring(0, 10) + '...', shape: 'box', color: '#a8e6cf', title: idea.content });
                
                if (idea.tags) {
                    const tags = idea.tags.split(',').map(t => t.trim()).filter(t => t.length > 0);
                    tags.forEach(tag => {
                        if (!tagNodes.has(tag)) {
                            const tagId = 'tag-' + tag;
                            tagNodes.set(tag, tagId);
                            nodes.push({ id: tagId, label: tag, shape: 'circle', color: '#ffd3b6' });
                        }
                        edges.push({ from: idea.id, to: tagNodes.get(tag) });
                    });
                }
            });

            const options = {
                physics: { stabilization: false, barnesHut: { gravitationalConstant: -2000, springLength: 100 } },
                nodes: { font: { size: 12 } },
                edges: { width: 1, color: '#cccccc' }
            };

            if (network === null) {
                network = new vis.Network(container, { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, options);
            } else {
                network.setData({ nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) });
            }
        }

        // ==========================================
        // 10. 頁面載入初始化
        // ==========================================
        window.onload = function() {
            // 1. 初始化 Supabase 連線
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            // 2. 檢查是否在 1 天內登入過
            if (!checkAutoLogin()) {
                // 沒登入過或過期了，顯示密碼輸入框
                document.getElementById('password-screen').style.display = 'flex';
            } else {
                // 有登入紀錄，直接抓資料畫圖
                fetchIdeasAndDrawGraph();
            }
        };
    </script>
</body>
</html>
